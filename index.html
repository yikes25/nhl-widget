<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NHL Today">
<meta name="theme-color" content="#0a1730">
<title>NHL Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff;background:#0a1730 linear-gradient(160deg,#0f2a5c 0%,#0a1730 55%,#050b1a 100%) fixed;
padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 96px);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;gap:8px;max-width:560px;margin:0 auto 14px}
.seg{flex:1;padding:12px 8px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:600;font-size:16px}
.seg.on{background:#2f6df6}
.gear{width:50px;border-radius:14px;background:rgba(255,255,255,.1);font-size:20px}
#dateLabel{max-width:560px;margin:0 auto 12px;font-size:15px;opacity:.7;text-align:center}
#list{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px 12px 16px}
.status{text-align:center;font-size:14px;font-weight:600;opacity:.8;margin-bottom:8px;letter-spacing:.04em}
.live{color:#ff4d4d;opacity:1;animation:pulse 1.2s ease-in-out infinite}
.row{display:flex;align-items:center}
.team{flex:1;text-align:center;min-width:0}
.team img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 4px}
.abbr{font-size:24px;font-weight:700}
.city{font-size:14px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{width:84px;text-align:center;font-size:30px;font-weight:700;flex:none}
.mid.at{font-size:26px;opacity:.6}
@keyframes pulse{50%{opacity:.35}}
.msg{text-align:center;padding:48px 16px;font-size:18px;opacity:.9}
.msg button,.msg a{margin-top:14px;display:inline-block;padding:11px 20px;border-radius:12px;background:#2f6df6;color:#fff;font-size:16px;font-weight:600;text-decoration:none}
.spin{width:36px;height:36px;margin:60px auto;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:rgba(8,16,36,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.1)}
.bar>*{flex:1;max-width:150px;min-width:0;padding:12px 4px;border-radius:12px;background:rgba(255,255,255,.1);font-size:15px;font-weight:600;text-align:center}
.bar .on{background:#2f6df6}
.bar input{color:#fff;border:0;font:inherit;font-size:15px;color-scheme:dark;width:100%}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:5}
#sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;margin:0 auto;max-height:85%;overflow:auto;background:#10234a;border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.panel h2{margin:0 0 4px;font-size:20px}
.panel p{margin:0 0 12px;opacity:.65;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:15px;font-weight:600}
.chip[aria-pressed=true]{background:#2f6df6}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;padding:12px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:600;font-size:16px}
.acts .go{background:#2f6df6}
</style>
</head>
<body>
<div class="top">
  <button class="seg" id="mMy"></button>
  <button class="seg" id="mAll">All Teams</button>
  <button class="gear" id="gear" aria-label="Choose teams">⚙️</button>
</div>
<div id="dateLabel"></div>
<div id="list"></div>

<div class="bar">
  <button id="bY">Yesterday</button>
  <button id="bT">Today</button>
  <button id="bM">Tomorrow</button>
  <div><input type="date" id="dp" aria-label="Pick date"></div>
</div>

<div id="sheet" hidden>
  <div class="panel">
    <h2>My Teams</h2>
    <p>Tap to toggle. Saved on this device.</p>
    <div class="chips" id="chips"></div>
    <div class="acts">
      <button id="reset">Reset</button>
      <button id="clear">Clear</button>
      <button id="done" class="go">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
var WORKER='https://nhl-proxy.tal-alexander25.workers.dev';
var KEY='nhl.v1';
var TEAMS=[['ANA','Anaheim'],['BOS','Boston'],['BUF','Buffalo'],['CGY','Calgary'],['CAR','Carolina'],['CHI','Chicago'],['COL','Colorado'],['CBJ','Columbus'],['DAL','Dallas'],['DET','Detroit'],['EDM','Edmonton'],['FLA','Florida'],['LAK','Los Angeles'],['MIN','Minnesota'],['MTL','Montréal'],['NSH','Nashville'],['NJD','New Jersey'],['NYI','NY Islanders'],['NYR','NY Rangers'],['OTT','Ottawa'],['PHI','Philadelphia'],['PIT','Pittsburgh'],['SJS','San Jose'],['SEA','Seattle'],['STL','St. Louis'],['TBL','Tampa Bay'],['TOR','Toronto'],['UTA','Utah'],['VAN','Vancouver'],['VGK','Vegas'],['WSH','Washington'],['WPG','Winnipeg']];
var DEF=['SJS','MTL','COL','PHI','EDM','TOR'];
var VALID={};TEAMS.forEach(function(t){VALID[t[0]]=1});
var $=function(id){return document.getElementById(id)};

function load(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&Array.isArray(s.teams))return{mode:s.mode==='all'?'all':'my',teams:s.teams.filter(function(t){return VALID[t]})};
  }catch(e){}
  return{mode:'my',teams:DEF.slice()};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function shift(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

var st=load(),date=ymd(new Date()),games=[],reqId=0,ctl=null;

function go(){
  var id=++reqId;
  if(ctl)ctl.abort();
  ctl=window.AbortController?new AbortController():null;
  $('list').innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';
  fetch(WORKER+'/v1/schedule/'+date,ctl?{signal:ctl.signal}:{})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(j){
      if(id!==reqId)return;
      var day=(j.gameWeek||[]).filter(function(d){return d.date===date})[0];
      games=day&&day.games?day.games:[];
      render();
    })
    .catch(function(e){
      if(id!==reqId||(e&&e.name==='AbortError'))return;
      $('list').innerHTML='<div class="msg">Couldn’t load games.<br><button id="retry">Try again</button></div>';
      $('retry').onclick=go;
    });
}

function team(t){
  return '<div class="team"><img src="'+esc(t.darkLogo||t.logo)+'" alt="" width="64" height="64">'+
    '<div class="abbr">'+esc(t.abbrev)+'</div><div class="city">'+esc(t.placeName&&t.placeName.default)+'</div></div>';
}

function card(g){
  var a=g.awayTeam,h=g.homeTeam,s=g.gameState,mid,stat;
  var live=s==='LIVE'||s==='CRIT',fin=s==='FINAL'||s==='OFF';
  if(live||fin){
    mid='<div class="mid">'+(a.score!=null?a.score:0)+' - '+(h.score!=null?h.score:0)+'</div>';
    stat=live?'<span class="live">● LIVE</span>':'FINAL';
  }else{
    mid='<div class="mid at">@</div>';
    stat=g.gameScheduleState&&g.gameScheduleState!=='OK'?esc(g.gameScheduleState):
      new Date(g.startTimeUTC).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  }
  return '<div class="card"><div class="status">'+stat+'</div><div class="row">'+team(a)+mid+team(h)+'</div></div>';
}

function render(){
  var my=st.mode==='my';
  $('mMy').textContent='My Teams ('+st.teams.length+')';
  $('mMy').className='seg'+(my?' on':'');
  $('mAll').className='seg'+(my?'':' on');
  var d=new Date(date+'T12:00:00');
  $('dateLabel').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
  $('dp').value=date;
  $('bY').className=date===shift(-1)?'on':'';
  $('bT').className=date===shift(0)?'on':'';
  $('bM').className=date===shift(1)?'on':'';
  var list=my?games.filter(function(g){return st.teams.indexOf(g.awayTeam.abbrev)>-1||st.teams.indexOf(g.homeTeam.abbrev)>-1}):games;
  if(!list.length){
    $('list').innerHTML=my?'<div class="msg">No games for your teams<br><a href="#" id="viewAll">View all games</a></div>':'<div class="msg">No games scheduled</div>';
    if(my)$('viewAll').onclick=function(e){e.preventDefault();setMode('all')};
    return;
  }
  $('list').innerHTML=list.map(card).join('');
}

function setMode(m){st.mode=m;save();render()}
function setDate(d){if(d){date=d;go()}}

function buildChips(){
  $('chips').innerHTML=TEAMS.map(function(t){
    return '<button class="chip" data-t="'+t[0]+'" aria-pressed="'+(st.teams.indexOf(t[0])>-1)+'">'+t[0]+' <span style="opacity:.6;font-weight:500">'+esc(t[1])+'</span></button>';
  }).join('');
}

$('mMy').onclick=function(){setMode('my')};
$('mAll').onclick=function(){setMode('all')};
$('gear').onclick=function(){buildChips();$('sheet').hidden=false};
$('done').onclick=function(){$('sheet').hidden=true};
$('sheet').onclick=function(e){if(e.target===this)this.hidden=true};
$('chips').onclick=function(e){
  var b=e.target.closest('.chip');if(!b)return;
  var t=b.getAttribute('data-t'),i=st.teams.indexOf(t);
  if(i>-1)st.teams.splice(i,1);else st.teams.push(t);
  b.setAttribute('aria-pressed',i<0);
  save();render();
};
$('reset').onclick=function(){st.teams=DEF.slice();save();buildChips();render()};
$('clear').onclick=function(){st.teams=[];save();buildChips();render()};
$('bY').onclick=function(){setDate(shift(-1))};
$('bT').onclick=function(){setDate(shift(0))};
$('bM').onclick=function(){setDate(shift(1))};
$('dp').onchange=function(){setDate(this.value)};
document.addEventListener('visibilitychange',function(){if(!document.hidden)go()});

render();go();
})();
</script>
</body>
</html>
